services:
  # Messages bus
  nats:
    restart: always
    image: nats-streaming
    command:
      - --cluster_id=cluster-test
      - --http_port=8222
    ports:
      - 4222:4222
      - 6222:6222
      - 8222:8222

  # Server
  server:
    restart: always
    build: server
    ports:
      - 3001:3001
    environment:
      - SERVER_PORT=3001
      - NATS_SERVERS=nats://nats:4222
      - CLUSTER_NAME=cluster-test
    depends_on:
      - nats

  # Client
  client:
    restart: always
    build: client
    ports:
      - 3000:80
    environment:
      - WEBSOCKET_URL=ws://127.0.0.1:3001

  # Services
  service_capslock_mode:
    restart: always
    build: services/capslock_mode
    environment:
      - NATS_SERVERS=nats://nats:4222
      - CLUSTER_NAME=cluster-test
      - CHANNEL_NAME=service.capslock_mode
    depends_on:
      - server
  service_happy:
    restart: always
    build: services/happy
    environment:
      - NATS_SERVERS=nats://nats:4222
      - CLUSTER_NAME=cluster-test
      - CHANNEL_NAME=service.happy
    depends_on:
      - server
